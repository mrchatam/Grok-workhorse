name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Unit tests (no backend CLI, no network, live tests skipped)
        run: npm run test:unit
      - name: Integration/live tests are skipped without a backend CLI
        env:
          WH_SKIP_INTEGRATION: "1"
        run: node --test test/*.test.mjs
